<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulot SpA | Quinchos & Construcción</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; padding: 20px; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { border: 1px solid #ddd; padding: 10px; border-radius: 8px; }
        img { width: 100%; height: 200px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Bienvenido a Bulot SpA</h1>
    <p>Mira nuestros proyectos:</p>

    <div class="grid">
        <!-- Ejemplo: Patagonia -->
        <div class="card">
            <h3>Patagonia Prime</h3>
            <img src="img/Patagonia-Prime.jpeg" alt="Patagonia">
        </div>

        <!-- Ejemplo: Amalfi -->
        <div class="card">
            <h3>Amalfi Luxe</h3>
            <img src="img/Amalfi-Luxe.jpeg" alt="Amalfi">
        </div>

        <!-- Ejemplo: Black Fortress -->
        <div class="card">
            <h3>Black Fortress</h3>
            <img src="img/Black-Fortress.jpeg" alt="Black Fortress">
        </div>
        
        <!-- Puedes añadir el resto siguiendo este formato -->
    </div>
</body>
</html>
